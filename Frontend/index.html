<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkManager - Dashboard</title>
    <link rel="stylesheet" type="text/css" href="/Frontend/Public/styles/index.css">
    <link rel="stylesheet" type="text/css" href="/Frontend/Public/styles/CentralStyles.css">
</head>
<body>
    <header id="CentralHeader">
        <!-- Menu Hamburger -->
        <button id="CentralHamburguerMenu">
            ☰
        </button>

        <!-- Logo / Nome -->
        <div id="CentralIcon">
            <h1 class="IconGray">Network<span class="IconWhite">Manager</span></h1>
        </div>

        <!-- Barra de pesquisa -->
        <form id="CentralSearchBar">
            <label for="CentralSearchInput">
                <img src="./Img/CentralSearchIcon.png" alt="">
            </label>
            <input type="search" id="CentralSearchInput" placeholder="Search for your life!">
        </form>

        <!-- Área do usuário -->
        <div id="CentralUserOptions">
            <span class="UsernameAlias">Admin</span>
        </div>
    </header>
</body>
</html>
